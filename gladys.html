<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FABREC | Gladys Garro</title>
  
  <!-- Fuente Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --font-base: 'Montserrat', sans-serif;
      --bg-app: #f8fafc;
      --bg-surface: #ffffff;
      --border: #e2e8f0;
      --border-subtle: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --primary: #0f172a;
      --primary-hover: #1e293b;
      --accent: #2563eb;
      --emerald: #059669;
      --emerald-hover: #047857;
      --emerald-bg: #ecfdf5;
      --emerald-border: #a7f3d0;
      --rose: #e11d48;
      --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06);
      --shadow-modal: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-base);
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* BARRA SUPERIOR */
    .header {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 0 40px;
    }

    .header-inner {
      max-width: 1360px;
      margin: 0 auto;
      height: 72px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }

    .brand-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text-primary);
    }

    .brand-role {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--text-secondary);
      text-transform: uppercase;
      padding-left: 14px;
      border-left: 1px solid var(--border);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* BOTONES */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-base);
      font-size: 12px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background: var(--bg-surface);
      border-color: var(--border);
      color: var(--text-secondary);
    }

    .btn-secondary:hover {
      background: var(--bg-app);
      color: var(--text-primary);
      border-color: var(--text-muted);
    }

    .btn-outline-danger {
      background: #ffffff;
      border: 1px solid #fecdd3;
      color: var(--rose);
    }

    .btn-outline-danger:hover {
      background: #fff1f2;
      border-color: var(--rose);
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-emerald {
      background: var(--emerald);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(5, 150, 105, 0.18);
    }

    .btn-emerald:hover {
      background: var(--emerald-hover);
    }

    .btn-icon {
      padding: 7px;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background: var(--bg-app);
      color: var(--text-primary);
      border-color: var(--border);
    }

    .btn-icon.duplicate:hover {
      background: #eff6ff;
      color: var(--accent);
      border-color: #bfdbfe;
    }

    .btn-icon.delete:hover {
      background: #fff1f2;
      color: var(--rose);
      border-color: #fecdd3;
    }

    .svg-icon {
      width: 15px;
      height: 15px;
      stroke-width: 2.2;
      stroke: currentColor;
      fill: none;
    }

    /* CONTENEDOR PRINCIPAL */
    .main-container {
      max-width: 1360px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 40px 60px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
    }

    /* BARRA DE VIGENCIA Y PROGRESO */
    .controls-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .dates-cluster {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .field-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .date-input {
      font-family: var(--font-base);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .date-input:focus {
      border-color: var(--primary);
    }

    .progress-tracker {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 40px;
    }

    .progress-text {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .progress-bar-bg {
      width: 110px;
      height: 6px;
      background: #e2e8f0;
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--emerald);
      width: 0%;
      transition: width 0.3s ease;
    }

    .search-input {
      font-family: var(--font-base);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 9px 14px;
      width: 220px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* TABLA DE PRECIOS */
    .table-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
    }

    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      background: #fafbfc;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 10px 20px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-primary);
      vertical-align: middle;
      transition: background-color 0.15s ease;
    }

    /* FILA SIN PRECIO (DESPEJADA Y LIMPIA) */
    tr.row-pendiente td {
      background-color: #fafbfc;
    }

    tr.row-pendiente .cell-product {
      color: #64748b;
      font-weight: 600;
    }

    tr.row-pendiente:hover td {
      background-color: #f1f5f9;
    }

    /* FILA CON PRECIO COMPLETO (DESTACADA Y BLANCA) */
    tr.row-completado td {
      background-color: #ffffff;
    }

    tr.row-completado .cell-product {
      color: var(--text-primary);
      font-weight: 800;
    }

    tr.row-completado:hover td {
      background-color: #fcfefe;
    }

    tr:last-child td {
      border-bottom: none;
    }

    /* CONTENEDOR E INPUTS DE PRECIO */
    .price-input-wrapper {
      display: inline-flex;
      align-items: center;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 6px 10px;
      transition: all 0.15s ease;
      width: 120px;
    }

    tr.row-completado .price-input-wrapper {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    .price-input-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.12);
      background: #ffffff;
    }

    .price-symbol {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      margin-right: 5px;
      user-select: none;
    }

    .price-input-cell {
      width: 100%;
      border: none;
      background: transparent;
      font-family: var(--font-base);
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
      text-align: right;
      outline: none;
    }

    .price-input-cell::placeholder {
      color: #cbd5e1;
      font-weight: 500;
    }

    /* ESTADOS */
    .status-badge {
      display: inline-flex;
      align-items: center;
      font-size: 10.5px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.2px;
      text-transform: uppercase;
      user-select: none;
    }

    .status-badge.completado {
      background: var(--emerald-bg);
      color: var(--emerald);
      border: 1px solid var(--emerald-border);
    }

    .status-badge.pendiente {
      background: #f1f5f9;
      color: #94a3b8;
      border: 1px solid #e2e8f0;
    }

    .pack-badge {
      display: inline-flex;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--bg-app);
      border: 1px solid var(--border);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .table-footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: #fafbfc;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .table-footer-text {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    /* MODAL NUEVO MODELO */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-modal);
      overflow: hidden;
      animation: modalIn 0.15s ease-out;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-primary);
    }

    .modal-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
      background: #fafbfc;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .input-text {
      font-family: var(--font-base);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    .input-text:focus {
      border-color: var(--primary);
    }

    /* TOAST DE CONFIRMACIÓN */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: var(--primary);
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <header class="header">
    <div class="header-inner">
      <div class="brand-group">
        <span class="brand-title">FABREC</span>
        <span class="brand-role">Gladys Garro • Gerencia General</span>
      </div>

      <div class="header-actions">
        <!-- BOTÓN NUEVO PRECIO -->
        <button onclick="confirmarNuevoPrecio()" class="btn btn-outline-danger" title="Vaciar todos los precios para un tarifario nuevo y limpio">
          <svg class="svg-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
          Nuevo precio
        </button>

        <button onclick="abrirModalNuevo()" class="btn btn-secondary">
          <svg class="svg-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
          Nuevo modelo
        </button>

        <button onclick="exportarPreciosWhatsApp()" class="btn btn-emerald">
          <svg class="svg-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 19.5l15-15m0 0H8.25m11.25 0v11.25"/></svg>
          Exportar precios
        </button>
      </div>
    </div>
  </header>

  <!-- CUERPO PRINCIPAL -->
  <main class="main-container">

    <!-- CONFIGURACIÓN DE VIGENCIA Y PROGRESO -->
    <section class="controls-card">
      <div class="dates-cluster">
        <div class="field-group">
          <label class="field-label">Vigente desde</label>
          <input type="date" id="fechaDesde" class="date-input">
        </div>

        <div class="field-group">
          <label class="field-label">Vigente hasta</label>
          <input type="date" id="fechaHasta" class="date-input">
        </div>
      </div>

      <!-- TRACKER VISUAL DE MODELOS COMPLETADOS -->
      <div class="progress-tracker">
        <span class="progress-text" id="txtProgreso">0 de 16 botellas con precio</span>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="barraProgreso"></div>
        </div>
      </div>

      <div>
        <input type="text" id="filtroBusqueda" oninput="filtrarModelos(this.value)" placeholder="Buscar botella en la lista..." class="search-input">
      </div>
    </section>

    <!-- LISTA PRINCIPAL DE TARIFAS -->
    <section class="table-card">
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 140px;">Estado</th>
              <th>Modelo / Botella</th>
              <th style="text-align: right; width: 160px;">Menor (&lt;100 paq)</th>
              <th style="text-align: right; width: 160px;">Mayor (&gt;100 paq)</th>
              <th style="text-align: right; width: 160px;">Cliente Final</th>
              <th style="text-align: center; width: 120px;">Empaque</th>
              <th style="text-align: right; width: 100px;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyTarifario">
            <!-- Filas generadas dinámicamente -->
          </tbody>
        </table>
      </div>

      <div class="table-footer">
        <span id="txtTotalItems" class="table-footer-text">16 modelos en catálogo</span>
        <span style="font-size: 11px; color: var(--text-muted); font-weight: 500;">
          Navega con ← → (columnas) y ↑ ↓ (filas) • Ctrl+D para duplicar a la siguiente
        </span>
      </div>
    </section>

  </main>

  <!-- MODAL: AGREGAR MODELO NUEVO -->
  <div id="modalNuevo" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h3 class="modal-title">Nuevo Modelo</h3>
        <button onclick="cerrarModal('modalNuevo')" class="btn-icon">
          <svg class="svg-icon" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-body">
        <div class="field-group">
          <label class="field-label">Nombre del Modelo</label>
          <input type="text" id="nuevoNombre" placeholder="Ej. 600 ml Especial" class="input-text">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="field-group">
            <label class="field-label">Menor (&lt;100 paq) S/</label>
            <input type="number" step="0.10" id="nuevoMenor" placeholder="0.00" class="input-text">
          </div>
          <div class="field-group">
            <label class="field-label">Mayor (&gt;100 paq) S/</label>
            <input type="number" step="0.10" id="nuevoMayor" placeholder="0.00" class="input-text">
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="field-group">
            <label class="field-label">Cliente Final S/</label>
            <input type="number" step="0.10" id="nuevoFinal" placeholder="0.00" class="input-text">
          </div>
          <div class="field-group">
            <label class="field-label">Unidades x Paquete</label>
            <select id="nuevoUnidades" class="input-text">
              <option value="100">100 unidades</option>
              <option value="50">50 unidades</option>
            </select>
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <button onclick="cerrarModal('modalNuevo')" class="btn btn-secondary">Cancelar</button>
        <button onclick="guardarNuevoModelo()" class="btn btn-primary">Agregar modelo</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICACIÓN -->
  <div id="toast" class="toast">
    <span id="toastMensaje">Notificación</span>
  </div>

  <script>
    // WhatsApp comercial directo de King[cite: 3]
    const WHATSAPP_EMPRESA_KING = "51922796815";

    const STORAGE_KEY_PRECIOS = "fabrec_precios_gladys_v6";
    const STORAGE_KEY_FECHAS = "fabrec_fechas_gladys_v6";

    // Catálogo oficial de botellas de Fabrec
    const MODELOS_CATALOGO = [
      { producto: "220 ml", unidades: 100 },
      { producto: "250 ml", unidades: 100 },
      { producto: "280 ml", unidades: 100 },
      { producto: "300 ml", unidades: 100 },
      { producto: "340 ml", unidades: 100 },
      { producto: "400 ml", unidades: 100 },
      { producto: "450 ml", unidades: 100 },
      { producto: "500 ml Néctar", unidades: 100 },
      { producto: "500 ml Gorda", unidades: 100 },
      { producto: "500 ml GH", unidades: 100 },
      { producto: "900 ml", unidades: 50 },
      { producto: "1000 ml", unidades: 50 },
      { producto: "1500 ml", unidades: 50 },
      { producto: "2500 ml", unidades: 50 },
      { producto: "3000 ml", unidades: 50 },
      { producto: "3000 ml (verde)", unidades: 50 }
    ];

    // Catálogo en blanco al iniciar
    function generarCatalogoBlanco() {
      return MODELOS_CATALOGO.map(item => ({
        producto: item.producto,
        menor: null,
        mayor: null,
        final: null,
        unidades: item.unidades
      }));
    }

    let listaPrecios = JSON.parse(localStorage.getItem(STORAGE_KEY_PRECIOS)) || generarCatalogoBlanco();

    // 1. Inicialización de Fechas
    function inicializarFechas() {
      const fechasGuardadas = JSON.parse(localStorage.getItem(STORAGE_KEY_FECHAS));
      const hoy = new Date();

      if (fechasGuardadas && fechasGuardadas.desde && fechasGuardadas.hasta) {
        document.getElementById('fechaDesde').value = fechasGuardadas.desde;
        document.getElementById('fechaHasta').value = fechasGuardadas.hasta;
      } else {
        const y = hoy.getFullYear();
        const m = String(hoy.getMonth() + 1).padStart(2, '0');
        const primerDia = `${y}-${m}-01`;
        const ultimoDiaMes = new Date(y, hoy.getMonth() + 1, 0).getDate();
        const ultimoDia = `${y}-${m}-${String(ultimoDiaMes).padStart(2, '0')}`;

        document.getElementById('fechaDesde').value = primerDia;
        document.getElementById('fechaHasta').value = ultimoDia;
      }

      document.getElementById('fechaDesde').addEventListener('change', persistirFechas);
      document.getElementById('fechaHasta').addEventListener('change', persistirFechas);
    }

    function persistirFechas() {
      const payload = {
        desde: document.getElementById('fechaDesde').value,
        hasta: document.getElementById('fechaHasta').value
      };
      localStorage.setItem(STORAGE_KEY_FECHAS, JSON.stringify(payload));
    }

    // 2. Renderizado de tabla
    function renderizarTabla(items = listaPrecios) {
      const tbody = document.getElementById('tbodyTarifario');
      tbody.innerHTML = '';

      let completadosCount = 0;

      items.forEach((item) => {
        const indexReal = listaPrecios.indexOf(item);
        
        const tienePrecio = item.menor !== null && item.menor !== '' &&
                            item.mayor !== null && item.mayor !== '' &&
                            item.final !== null && item.final !== '';

        if (tienePrecio) completadosCount++;

        const tr = document.createElement('tr');
        tr.className = tienePrecio ? 'row-completado' : 'row-pendiente';
        tr.dataset.indexReal = indexReal;

        const valMenor = item.menor !== null ? item.menor : '';
        const valMayor = item.mayor !== null ? item.mayor : '';
        const valFinal = item.final !== null ? item.final : '';

        tr.innerHTML = `
          <td>
            <span class="status-badge ${tienePrecio ? 'completado' : 'pendiente'}">
              ${tienePrecio ? '● Listo' : '○ Sin precio'}
            </span>
          </td>
          <td class="cell-product">${item.producto}</td>
          <td style="text-align: right;">
            <div class="price-input-wrapper">
              <span class="price-symbol">S/</span>
              <input type="number" step="0.10" placeholder="—" value="${valMenor}" 
                data-col="0" data-index-real="${indexReal}"
                oninput="actualizarPrecioEnLinea(${indexReal}, 'menor', this.value)" 
                onkeydown="gestionarNavegacionTeclado(event)" class="price-input-cell">
            </div>
          </td>
          <td style="text-align: right;">
            <div class="price-input-wrapper">
              <span class="price-symbol">S/</span>
              <input type="number" step="0.10" placeholder="—" value="${valMayor}" 
                data-col="1" data-index-real="${indexReal}"
                oninput="actualizarPrecioEnLinea(${indexReal}, 'mayor', this.value)" 
                onkeydown="gestionarNavegacionTeclado(event)" class="price-input-cell">
            </div>
          </td>
          <td style="text-align: right;">
            <div class="price-input-wrapper">
              <span class="price-symbol">S/</span>
              <input type="number" step="0.10" placeholder="—" value="${valFinal}" 
                data-col="2" data-index-real="${indexReal}"
                oninput="actualizarPrecioEnLinea(${indexReal}, 'final', this.value)" 
                onkeydown="gestionarNavegacionTeclado(event)" class="price-input-cell">
            </div>
          </td>
          <td style="text-align: center;"><span class="pack-badge">${item.unidades} un.</span></td>
          <td style="text-align: right;">
            <div style="display: inline-flex; gap: 4px; align-items: center;">
              <!-- BOTÓN DUPLICAR PRECIOS -->
              <button onclick="duplicarPreciosSiguiente(${indexReal})" class="btn-icon duplicate" title="Duplicar estos precios a la siguiente fila (Ctrl+D)">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 13.5L12 21m0 0l-7.5-7.5M12 21V3"/>
                </svg>
              </button>
              <!-- BOTÓN ELIMINAR MODELO -->
              <button onclick="eliminarModelo(${indexReal})" class="btn-icon delete" title="Eliminar modelo">
                <svg class="svg-icon" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
              </button>
            </div>
          </td>
        `;
        tbody.appendChild(tr);
      });

      const total = listaPrecios.length;
      document.getElementById('txtTotalItems').innerText = `${total} modelos en catálogo`;
      document.getElementById('txtProgreso').innerText = `${completadosCount} de ${total} botellas con precio`;
      const porcentaje = total > 0 ? (completadosCount / total) * 100 : 0;
      document.getElementById('barraProgreso').style.width = `${porcentaje}%`;
    }

    // 3. Navegación directa con flechas: Arriba/Abajo por fila y Derecha/Izquierda por columna
    function gestionarNavegacionTeclado(event) {
      const input = event.target;
      const col = parseInt(input.dataset.col);
      const currentTr = input.closest('tr');
      const indexReal = parseInt(input.dataset.indexReal);

      // Duplicar a la siguiente fila con Ctrl + D
      if ((event.ctrlKey || event.metaKey) && (event.key === 'd' || event.key === 'D')) {
        event.preventDefault();
        duplicarPreciosSiguiente(indexReal);
        return;
      }

      // ARRIBA: Misma columna, fila anterior
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        const prevTr = currentTr.previousElementSibling;
        if (prevTr) {
          const targetInput = prevTr.querySelector(`.price-input-cell[data-col="${col}"]`);
          if (targetInput) {
            targetInput.focus();
            targetInput.select();
          }
        }
      } 
      // ABAJO / ENTER: Misma columna, fila siguiente
      else if (event.key === 'ArrowDown' || event.key === 'Enter') {
        event.preventDefault();
        const nextTr = currentTr.nextElementSibling;
        if (nextTr) {
          const targetInput = nextTr.querySelector(`.price-input-cell[data-col="${col}"]`);
          if (targetInput) {
            targetInput.focus();
            targetInput.select();
          }
        }
      } 
      // IZQUIERDA: Columna anterior directa
      else if (event.key === 'ArrowLeft') {
        event.preventDefault();
        if (col > 0) {
          const targetInput = currentTr.querySelector(`.price-input-cell[data-col="${col - 1}"]`);
          if (targetInput) {
            targetInput.focus();
            targetInput.select();
          }
        } else {
          // Si está en la primera columna, retrocede a la última columna de la fila anterior
          const prevTr = currentTr.previousElementSibling;
          if (prevTr) {
            const targetInput = prevTr.querySelector(`.price-input-cell[data-col="2"]`);
            if (targetInput) {
              targetInput.focus();
              targetInput.select();
            }
          }
        }
      } 
      // DERECHA: Columna siguiente directa
      else if (event.key === 'ArrowRight') {
        event.preventDefault();
        if (col < 2) {
          const targetInput = currentTr.querySelector(`.price-input-cell[data-col="${col + 1}"]`);
          if (targetInput) {
            targetInput.focus();
            targetInput.select();
          }
        } else {
          // Si está en la última columna, pasa a la primera columna de la siguiente fila
          const nextTr = currentTr.nextElementSibling;
          if (nextTr) {
            const targetInput = nextTr.querySelector(`.price-input-cell[data-col="0"]`);
            if (targetInput) {
              targetInput.focus();
              targetInput.select();
            }
          }
        }
      }
    }

    // 4. Duplicar Precios hacia la siguiente fila
    function duplicarPreciosSiguiente(indexReal) {
      const itemOrigen = listaPrecios[indexReal];

      if (itemOrigen.menor === null && itemOrigen.mayor === null && itemOrigen.final === null) {
        mostrarToast("Ingresa precios en este modelo antes de duplicar");
        return;
      }

      if (indexReal + 1 >= listaPrecios.length) {
        mostrarToast("Ya estás en el último modelo de la lista");
        return;
      }

      const itemDestino = listaPrecios[indexReal + 1];
      itemDestino.menor = itemOrigen.menor;
      itemDestino.mayor = itemOrigen.mayor;
      itemDestino.final = itemOrigen.final;

      guardarEnStorage();
      renderizarTabla();

      // Enfoca y selecciona el primer precio de la fila duplicada
      setTimeout(() => {
        const nextTr = document.querySelector(`tr[data-index-real="${indexReal + 1}"]`);
        if (nextTr) {
          const firstInput = nextTr.querySelector(`.price-input-cell[data-col="0"]`);
          if (firstInput) {
            firstInput.focus();
            firstInput.select();
          }
        }
      }, 30);

      mostrarToast(`Precios duplicados a "${itemDestino.producto}"`);
    }

    // 5. Edición en línea reactiva sin perder cursor
    function actualizarPrecioEnLinea(index, campo, valor) {
      if (valor === '') {
        listaPrecios[index][campo] = null;
      } else {
        const num = parseFloat(valor);
        listaPrecios[index][campo] = isNaN(num) ? null : num;
      }
      guardarEnStorage();

      const item = listaPrecios[index];
      const tr = document.querySelector(`tr[data-index-real="${index}"]`);
      if (tr) {
        const tienePrecio = item.menor !== null && item.menor !== '' &&
                            item.mayor !== null && item.mayor !== '' &&
                            item.final !== null && item.final !== '';

        tr.className = tienePrecio ? 'row-completado' : 'row-pendiente';
        const badge = tr.querySelector('.status-badge');
        if (badge) {
          badge.className = `status-badge ${tienePrecio ? 'completado' : 'pendiente'}`;
          badge.innerHTML = tienePrecio ? '● Listo' : '○ Sin precio';
        }
      }

      actualizarTracker();
    }

    function actualizarTracker() {
      let completadosCount = 0;
      listaPrecios.forEach(item => {
        if (item.menor !== null && item.menor !== '' &&
            item.mayor !== null && item.mayor !== '' &&
            item.final !== null && item.final !== '') {
          completadosCount++;
        }
      });
      const total = listaPrecios.length;
      document.getElementById('txtProgreso').innerText = `${completadosCount} de ${total} botellas con precio`;
      const porcentaje = total > 0 ? (completadosCount / total) * 100 : 0;
      document.getElementById('barraProgreso').style.width = `${porcentaje}%`;
    }

    // 6. Botón "Nuevo precio": Vacía la lista
    function confirmarNuevoPrecio() {
      listaPrecios.forEach(item => {
        item.menor = null;
        item.mayor = null;
        item.final = null;
      });
      guardarEnStorage();
      renderizarTabla();
      mostrarToast("Tarifario en blanco listo para nuevos precios");
    }

    // 7. Agregar nuevo modelo
    function abrirModalNuevo() {
      document.getElementById('nuevoNombre').value = '';
      document.getElementById('nuevoMenor').value = '';
      document.getElementById('nuevoMayor').value = '';
      document.getElementById('nuevoFinal').value = '';
      document.getElementById('modalNuevo').classList.add('active');
      document.getElementById('nuevoNombre').focus();
    }

    function guardarNuevoModelo() {
      const nombre = document.getElementById('nuevoNombre').value.trim();
      const valMenor = document.getElementById('nuevoMenor').value;
      const valMayor = document.getElementById('nuevoMayor').value;
      const valFinal = document.getElementById('nuevoFinal').value;
      const unidades = parseInt(document.getElementById('nuevoUnidades').value) || 100;

      if (!nombre) {
        mostrarToast("Escribe el nombre del modelo");
        return;
      }

      listaPrecios.push({
        producto: nombre,
        menor: valMenor !== '' ? parseFloat(valMenor) : null,
        mayor: valMayor !== '' ? parseFloat(valMayor) : null,
        final: valFinal !== '' ? parseFloat(valFinal) : null,
        unidades
      });

      guardarEnStorage();
      cerrarModal('modalNuevo');
      renderizarTabla();
      mostrarToast(`Modelo "${nombre}" agregado al catálogo`);
    }

    function eliminarModelo(index) {
      const nombre = listaPrecios[index].producto;
      listaPrecios.splice(index, 1);
      guardarEnStorage();
      renderizarTabla();
      mostrarToast(`Modelo ${nombre} removido`);
    }

    function guardarEnStorage() {
      localStorage.setItem(STORAGE_KEY_PRECIOS, JSON.stringify(listaPrecios));
    }

    function filtrarModelos(texto) {
      const q = texto.toLowerCase().trim();
      const filtrados = listaPrecios.filter(item => item.producto.toLowerCase().includes(q));
      renderizarTabla(filtrados);
    }

    function cerrarModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    // 8. Exportar precios exclusivamente en JSON limpio a WhatsApp
    function exportarPreciosWhatsApp() {
      const fechaDesde = document.getElementById('fechaDesde').value;
      const fechaHasta = document.getElementById('fechaHasta').value;

      const modelosConPrecio = listaPrecios.filter(item => 
        item.menor !== null && item.mayor !== null && item.final !== null
      );

      if (modelosConPrecio.length === 0) {
        mostrarToast("Ingresa los precios antes de exportar");
        return;
      }

      const payload = {
        empresa: "FABREC",
        tipo_documento: "tarifario_oficial_0001",
        autorizado_por: "Gladys Garro",
        cargo: "Gerencia General",
        fecha_emision: new Date().toISOString(),
        vigencia: {
          desde: fechaDesde,
          hasta: fechaHasta
        },
        total_productos: modelosConPrecio.length,
        precios: modelosConPrecio.map(item => ({
          producto: item.producto,
          precio_menor: item.menor,
          precio_mayor: item.mayor,
          precio_cliente_final: item.final,
          unidades_paquete: item.unidades
        }))
      };

      const textoJSON = JSON.stringify(payload, null, 2);

      const url = `https://api.whatsapp.com/send/?phone=${WHATSAPP_EMPRESA_KING}&text=${encodeURIComponent(textoJSON)}`;
      window.open(url, '_blank');
      mostrarToast("Abriendo WhatsApp con tarifas...");
    }

    function mostrarToast(texto) {
      const t = document.getElementById('toast');
      document.getElementById('toastMensaje').innerText = texto;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    window.addEventListener('DOMContentLoaded', () => {
      inicializarFechas();
      renderizarTabla();
    });
  </script>
</body>
</html>
